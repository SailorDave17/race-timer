# The declared surface of Mad Cow Race Timer -- GENERATED, never hand-edited.
#
# Regenerate with:  python3 .github/scripts/declared-surface.py --write
# Checked in CI by the same script with --check.
#
# This file exists so that adding a permission, an exported component or a dependency
# cannot silently falsify the PUBLISHED privacy policy. Before updating it, re-check:
#   docs/privacy-policy.md  (permission table, "no INTERNET", "no third-party SDKs", Device backup)
#   docs/play-store-fgs-justification.md  (the why-no-standard-type argument, and the subtype string)
#   docs/play-app-content-declarations.md  (Play Console > App content, incl. Data safety and Advertising ID)
#
# Read from each app's MERGED release manifest, not from its source manifest: a dependency
# can inject a permission or an exported receiver the source never names, and two of the
# entries below are exactly that. Dependencies are release-runtime only, so nothing
# test-only appears; coordinates carry no version, so a version bump is silent and a new
# dependency is not. See the script's docstring for what is deliberately absent.

[manifest :wear]
# wear/build/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml
allow-backup true
fgs-subtype com.racetimer.wear.TimerService = Racing timer — keeps the start-sequence running while the screen is off
permission io.github.sailordave17.racetimer.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION protectionLevel=signature
provider androidx.startup.InitializationProvider exported=false
receiver androidx.profileinstaller.ProfileInstallReceiver exported=true
service com.racetimer.wear.TimerService exported=false foregroundServiceType=specialUse
uses-feature android.hardware.audio.output required=false
uses-feature android.hardware.type.watch required=true
uses-permission android.permission.FOREGROUND_SERVICE
uses-permission android.permission.FOREGROUND_SERVICE_SPECIAL_USE
uses-permission android.permission.POST_NOTIFICATIONS
uses-permission android.permission.VIBRATE
uses-permission android.permission.WAKE_LOCK
uses-permission io.github.sailordave17.racetimer.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION

[manifest :phone]
# phone/build/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml
allow-backup false
fgs-subtype com.racetimer.phone.PhoneTimerService = Racing timer — keeps the start-sequence cueing while the screen is off
permission io.github.sailordave17.racetimer.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION protectionLevel=signature
provider androidx.startup.InitializationProvider exported=false
receiver androidx.profileinstaller.ProfileInstallReceiver exported=true
service com.racetimer.phone.PhoneTimerService exported=false foregroundServiceType=specialUse
uses-permission android.permission.FOREGROUND_SERVICE
uses-permission android.permission.FOREGROUND_SERVICE_SPECIAL_USE
uses-permission android.permission.POST_NOTIFICATIONS
uses-permission android.permission.WAKE_LOCK
uses-permission io.github.sailordave17.racetimer.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION

