name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# A new push to a PR makes the in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and assemble
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Two JDKs are genuinely needed: AGP 8.2 refuses to run on anything below 17,
      # while :shared declares jvmToolchain(8). 17 is listed last so it becomes
      # JAVA_HOME and runs Gradle itself.
      - name: Set up JDK 8 and 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # The wrapper jar is a binary committed to the repo; verify it against the
          # published Gradle checksums on every run rather than trusting the blob.
          validate-wrappers: true

      # #83. docs/privacy-policy.md is PUBLISHED and Play fetches it; it asserts no INTERNET
      # permission, no third-party SDKs or analytics, a permission table that matches what ships,
      # and which app disables Auto Backup. docs/play-store-fgs-justification.md argues at length
      # that no standard foreground-service type applies. All of that was guarded by a COMMENT in
      # each document, which only works if whoever adds a permission happens to open a file they had
      # no reason to open - and the consequence of the miss is a live public policy that lies about
      # the app, which is grounds for removal rather than a stale doc.
      #
      # First Gradle step on purpose. It reads the merged release manifests and the release runtime
      # classpaths, so it needs nothing compiled and finishes long before the suites do - a policy
      # violation should not wait behind R8.
      # `python3 -V` first, because the runner's interpreter is the binding one and is older than a
      # maintainer's. This step's first run died with a TypeError from a 3.13-only API that passed
      # locally; printing the version makes the next instance of that class name its own cause
      # instead of looking like a bug in the check.
      - name: Check the declared-surface lock
        env:
          GRADLE_ARGS: -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64
        run: |
          python3 -V
          python3 .github/scripts/declared-surface.py --check

      # Point Gradle at the JDKs setup-java installed so the JVM 8 toolchain resolves
      # from disk. If this ever stops matching, the foojay resolver in settings.gradle.kts
      # downloads a JDK instead and the build still succeeds - just more slowly.
      - name: Run shared unit tests
        run: ./gradlew :shared:test -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64

      # Robolectric fetches an `android-all` jar per SDK level into ~/.m2 on first use, outside the
      # Gradle caches setup-gradle restores. Two modules now depend on it, so an uncached runner
      # downloads ~100 MB before either test step can start. Keyed on the version catalog, which is
      # where the Robolectric version lives.
      - name: Cache Robolectric android-all jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-${{ runner.os }}-

      # #160. The watch module had no test source set for four months, so its orchestration - the
      # #62 start ordering, the four-key race snapshot, the foreground notification, the #95 volume
      # borrow - was hardware-verified or nothing. Robolectric here is scoped to those non-audio
      # surfaces by owner decision; `AudioHapticBoundaryTest` fails this step if a test ever reaches
      # for the cue path, which stays a wrist question (#61, #114, #144).
      - name: Run wear unit tests
        run: ./gradlew :wear:testDebugUnitTest -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64

      - name: Assemble wear debug APK
        run: ./gradlew :wear:assembleDebug -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64

      # The phone module joins the gate in the same change that creates it (#197). :wear has been
      # here since the start and had no test source set for four months; :phone gets both on day
      # one, so its orchestration cannot become hardware-verified-or-nothing the way #160 records
      # the watch's having done.
      - name: Run phone unit tests
        run: ./gradlew :phone:testDebugUnitTest -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64

      - name: Assemble phone debug APK
        run: ./gradlew :phone:assembleDebug -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64

      # CI has never built a release in this repo, so R8 only ever ran when someone
      # remembered to run it by hand - which is how the first release build happened
      # four days after the toolchain that enabled it (#127, #70). This step is the
      # guard that stops that recurring: R8 runs on every push and PR, and a failure
      # here fails the run.
      #
      # Unsigned by design, and no secret reaches the runner. wear/build.gradle.kts
      # creates the release signingConfig only when a keystore.properties exists; this
      # workflow writes none, so the bundle builds unsigned.
      #
      # That is deliberate and stays deliberate now that #81 has shipped: signing lives in
      # release.yml, which runs on a tag and is the only workflow the upload keystore secrets
      # are exposed to. Every push and PR runs R8 here without ever touching a credential.
      - name: Build wear release bundle (unsigned - this is where R8 runs)
        run: ./gradlew :wear:bundleRelease -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64

      # #211 AC 5. The phone joins the same guard for the same reason (#129): R8 runs on every push
      # so a minification break cannot wait until somebody remembers to cut a release. Unsigned here
      # exactly as :wear is - the shared racetimer.release-artifacts plugin creates the release
      # signingConfig only when a keystore.properties exists, and this workflow writes none.
      #
      # It also exercises checkVersionCodeCollision, which every bundleRelease depends on: two app
      # modules under one applicationId reusing a versionCode is a state Play refuses, and this is
      # where it gets caught rather than at upload.
      - name: Build phone release bundle (unsigned - R8 and the versionCode guard)
        run: ./gradlew :phone:bundleRelease -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64

      - name: Upload test reports
        # Failures are exactly when the report is worth reading.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/test/
            wear/build/reports/tests/testDebugUnitTest/
            phone/build/reports/tests/testDebugUnitTest/
          retention-days: 14

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: |
            wear/build/outputs/apk/debug/wear-debug.apk
            phone/build/outputs/apk/debug/phone-debug.apk
          retention-days: 14
