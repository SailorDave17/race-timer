name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# A new push to a PR makes the in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and assemble
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Two JDKs are genuinely needed: AGP 8.2 refuses to run on anything below 17,
      # while :shared declares jvmToolchain(8). 17 is listed last so it becomes
      # JAVA_HOME and runs Gradle itself.
      - name: Set up JDK 8 and 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # The wrapper jar is a binary committed to the repo; verify it against the
          # published Gradle checksums on every run rather than trusting the blob.
          validate-wrappers: true

      # Point Gradle at the JDKs setup-java installed so the JVM 8 toolchain resolves
      # from disk. If this ever stops matching, the foojay resolver in settings.gradle.kts
      # downloads a JDK instead and the build still succeeds - just more slowly.
      - name: Run shared unit tests
        run: ./gradlew :shared:test -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64

      - name: Assemble wear debug APK
        run: ./gradlew :wear:assembleDebug -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64

      - name: Upload test report
        # Failures are exactly when the report is worth reading.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shared-test-report
          path: shared/build/reports/tests/test/
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wear-debug-apk
          path: wear/build/outputs/apk/debug/wear-debug.apk
          retention-days: 14
