[versions]
# 8.6 is the floor for `compileSdk = 35`, which #69 needs before the 2026-08-31 Wear OS
# target-API deadline. Kotlin stays at 1.9.22 so `composeOptions.kotlinCompilerExtensionVersion`
# (1.5.8, pinned to exactly this Kotlin) keeps working — see the note on `kotlin` below.
agp = "8.6.1"
# Held deliberately. Kotlin 2.x replaces `composeOptions` with the
# `org.jetbrains.kotlin.plugin.compose` Gradle plugin and switches on K2, which is a real upgrade
# but a separate one. Stacking it on a deadline-driven AGP bump mixes two failure modes.
kotlin = "1.9.22"
coreKtx = "1.12.0"
composeBom = "2024.02.00"
wearCompose = "1.3.0"
wearActivity = "1.2.0"
wearInput = "1.1.0"
horologist = "0.6.6"
lifecycleRuntime = "2.7.0"
activityCompose = "1.8.2"
junit = "4.13.2"
# Robolectric runs :phone's unit tests against a real Context on the JVM. Scoped deliberately: the
# audio and haptic path is a firm NO (a shadow AudioTrack is a fourth instrument of the class that
# reported success through #61 while the watch was silent), and #160's scoped yes covers the
# non-audio surfaces only. 4.14.1 is the floor for API 35, which is :phone's compileSdk/targetSdk.
robolectric = "4.14.1"
junitExt = "1.1.5"
espressoCore = "3.5.1"
watchfaceComplications = "1.2.1"
wear = "1.3.0"

[libraries]
# AndroidX
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntime" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntime" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Compose BOM
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }

# Wear OS Compose
wear-compose-bom = { group = "androidx.wear.compose", name = "compose-bom", version = "1.3.0" }
wear-compose-material = { group = "androidx.wear.compose", name = "compose-material", version.ref = "wearCompose" }
wear-compose-foundation = { group = "androidx.wear.compose", name = "compose-foundation", version.ref = "wearCompose" }
wear-compose-navigation = { group = "androidx.wear.compose", name = "compose-navigation", version.ref = "wearCompose" }
wear-compose-ui-tooling = { group = "androidx.wear.compose", name = "compose-ui-tooling", version.ref = "wearCompose" }

# Wear OS core
wear-core = { group = "androidx.wear", name = "wear", version.ref = "wear" }
wear-activity = { group = "androidx.wear", name = "wear-ongoing", version = "1.0.0" }
wear-input = { group = "androidx.wear", name = "wear-input", version.ref = "wearInput" }

# Wear Ongoing Activity
wear-ongoing = { group = "androidx.wear", name = "wear-ongoing", version = "1.0.0" }

# Horologist (optional Wear OS utilities)
horologist-compose-layout = { group = "com.google.android.horologist", name = "horologist-compose-layout", version.ref = "horologist" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitExt" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
