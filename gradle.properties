org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
# #195, run 1 of 3: AGP 9 with both of its opt-outs set, so Gradle and AGP are the only new variables.
# AGP 9 refuses org.jetbrains.kotlin.android unless BOTH are set. Removed one at a time: builtInKotlin
# with that plugin in run 2, then newDsl in run 3.
android.builtInKotlin=false
android.newDsl=false
