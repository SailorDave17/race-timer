# Robolectric runs :phone's unit tests against SDK 35 even though the app targets 36 (#261).
#
# Not a preference. Measured 2026-08-18:
#   UnsupportedOperationException: Failed to create a Robolectric sandbox:
#   Android SDK 36 requires Java 21 (have Java 17)
#
# This repo runs JDK 8 (:shared's toolchain) and JDK 17 (AGP's floor, and what runs Gradle), and
# ci.yml provisions exactly those two. An SDK 36 sandbox needs a THIRD JDK, which is more than the
# deadline-bound targetSdk bump should carry. Robolectric 4.14.1 also caps at 35 outright
# ("Package targetSdkVersion=36 > maxSdkVersion=35"), so the move is Java 21 AND Robolectric 4.16.1.
#
# WHAT THIS COSTS, STATED RATHER THAN IMPLIED: this suite certifies API 35. Every API 36 behaviour
# change is invisible to it by construction, not by oversight. What makes that acceptable here is
# that these tests cover routing and orchestration, and #261's ACs 5 and 6 prove API 36 behaviour on
# a real device - the only place it can be proven at all.
#
# TRACKED AS #275, which deletes this file. A closed issue tracks nothing, so the pin's lifetime is
# that issue's, not this comment's.
sdk=35
